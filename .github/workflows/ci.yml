name: GovernLoop CI Baseline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets jsonschema

      - name: Verify installable GovernLoop CLI
        run: |
          python -m pip install .
          governloop --help >/dev/null
          python -c "import governloop_runtime, agentops_runtime"

      - name: Python syntax & import smoke check
        run: |
          python -m py_compile scripts/relay_adapter.py
          python -m py_compile tools/neutral-relay/neutral_relay.py
          python -m py_compile tools/agentops_runtime/*.py
          python -m py_compile tools/governloop_runtime/*.py
          PYTHONPATH=tools python -m governloop_runtime --help >/dev/null

      - name: Run relay_adapter tests
        run: |
          if [ ! -f tests/test_relay_adapter.py ]; then
            echo "tests/test_relay_adapter.py is missing! Failing."
            exit 1
          fi
          python -m unittest discover -s tests

      - name: Run neutral_relay tests
        run: |
          if [ ! -f tools/neutral-relay/tests/test_neutral_relay.py ]; then
            echo "neutral relay test suite is missing! Failing."
            exit 1
          fi
          python -m unittest discover -s tools/neutral-relay/tests

      - name: Run pre-v0.1 runtime regression tests
        run: |
          if [ ! -f tools/agentops_runtime/tests/test_agentops_runtime.py ]; then
            echo "pre-v0.1 runtime regression suite is missing! Failing."
            exit 1
          fi
          PYTHONPATH=tools python -m unittest discover -s tools/agentops_runtime/tests

      - name: Run GovernLoop canonical runtime tests
        run: |
          if [ ! -f tools/governloop_runtime/tests/test_governloop_runtime.py ]; then
            echo "GovernLoop runtime test suite is missing! Failing."
            exit 1
          fi
          PYTHONPATH=tools python -m unittest discover -s tools/governloop_runtime/tests
