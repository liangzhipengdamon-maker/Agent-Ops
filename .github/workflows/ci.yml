name: AgentOps CI Baseline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets

      - name: Python syntax & import smoke check
        run: |
          python -m py_compile scripts/relay_adapter.py
          if [ -f tools/neutral-relay/neutral_relay.py ]; then
            python -m py_compile tools/neutral-relay/neutral_relay.py
          fi

      - name: Run relay_adapter tests
        run: |
          if [ ! -f tests/test_relay_adapter.py ]; then
            echo "tests/test_relay_adapter.py is missing! Failing."
            exit 1
          fi
          python -m unittest tests/test_relay_adapter.py

      - name: Run neutral_relay tests
        run: |
          if [ -f tools/neutral-relay/neutral_relay.py ]; then
            if [ ! -f tools/neutral-relay/tests/test_neutral_relay.py ]; then
              echo "neutral_relay.py exists but test file tools/neutral-relay/tests/test_neutral_relay.py is missing! Failing."
              exit 1
            fi
            python -m unittest tools/neutral-relay/tests/test_neutral_relay.py
          else
            echo "tools/neutral-relay/neutral_relay.py not found. Skipping neutral_relay tests."
          fi
